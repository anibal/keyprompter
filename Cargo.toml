[package]
name = "keyprompter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "keyprompter"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
gpui-kit = "=0.7.3"
dirs = "=6.0.0"

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
