[package]
name = "keyprompter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "keyprompter"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
gpui-kit = "=0.7.3"
dirs = "=6.0.0"
futures = "0.3"
url = "2"
global-hotkey = "0.7"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSWorkspace", "NSScreen", "NSEvent", "objc2-core-foundation"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
